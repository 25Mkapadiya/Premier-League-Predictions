name: Refresh drafted player stats

on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"
  push:
    branches: [main]
    paths:
      - data/draft.json
      - scripts/refresh_draft.py
      - scripts/public_sources.py
      - scripts/prediction_core.py
      - .github/workflows/refresh-draft.yml

permissions:
  contents: write

concurrency:
  group: premier-league-draft
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate script
        run: |
          python -m py_compile scripts/public_sources.py
          python -m py_compile scripts/prediction_core.py
          python -m py_compile scripts/refresh_draft.py
      - name: Refresh drafted player stats
        run: python scripts/refresh_draft.py
      - name: Commit refreshed draft stats
        run: |
          if git diff --quiet -- data/draft_stats.js; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draft_stats.js
          git commit -m "Refresh drafted player stats"
          for attempt in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (another workflow likely pushed first), rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
