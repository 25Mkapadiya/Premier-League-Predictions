name: Validate prediction dashboard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-v3.js
          node --check noapi-preload.js
          node --check noapi-ui.js
      - name: Check no-key forecasting Python
        run: |
          python -m py_compile scripts/public_sources.py
          python -m py_compile scripts/prediction_core.py
          python -m py_compile scripts/prediction_runtime.py
          python -m py_compile scripts/refresh_results.py
          python -m py_compile scripts/build_predictions.py
          python -m py_compile scripts/refresh_snapshot.py
          python -m py_compile scripts/run_refresh.py
          python -m py_compile scripts/train_ensemble.py
          python -m py_compile scripts/train_ensemble_fast.py
          python -m py_compile scripts/train_nomarket.py
      - name: Check JSON configuration
        run: |
          python - <<'PY'
          import json
          for path in ['data/context.json','data/trained_model.json','data/trained_nomarket.json','data/training_status.json']:
              json.load(open(path))
              print(path, 'OK')
          PY
      - name: Check required page hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html=Path('index.html').read_text();HTMLParser().feed(html)
          for element_id in ['fixture-feed','featured-match','league-table','home-select','away-select','refresh-data','results-feed']:
              assert f'id="{element_id}"' in html,element_id
          for asset in ['app-v3.js','noapi-preload.js','noapi-ui.js','accuracy.css']:
              assert asset in html,asset
          print('HTML hooks OK')
          PY
