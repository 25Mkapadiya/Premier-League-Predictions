name: Refresh Premier League prediction data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - scripts/public_sources.py
      - scripts/prediction_core.py
      - scripts/prediction_runtime.py
      - scripts/refresh_results.py
      - scripts/build_predictions.py
      - scripts/refresh_snapshot.py
      - scripts/run_refresh.py
      - data/trained_model.json
      - data/trained_nomarket.json
      - data/context.json
      - .github/workflows/refresh-results.yml

permissions:
  contents: write

concurrency:
  group: premier-league-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate no-key forecasting scripts
        run: |
          python -m py_compile scripts/public_sources.py
          python -m py_compile scripts/prediction_core.py
          python -m py_compile scripts/prediction_runtime.py
          python -m py_compile scripts/refresh_results.py
          python -m py_compile scripts/build_predictions.py
          python -m py_compile scripts/refresh_snapshot.py
          python -m py_compile scripts/run_refresh.py
      - name: Refresh public data and forecasts
        run: python scripts/run_refresh.py
      - name: Commit refreshed snapshot and diagnostic
        run: |
          if git diff --quiet -- data/live.js data/refresh_status.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.js data/refresh_status.json
          git commit -m "Refresh no-key Premier League forecasts"
          for attempt in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (another workflow likely pushed first), rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
